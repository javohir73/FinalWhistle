# Production smoke test — verifies the live site + API serve the critical paths.
# Runs on a schedule and on demand (also handy to run right after a deploy).
name: smoke

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SITE: https://fifa-wc26-prediction.vercel.app
      API: https://pitchprophet-api.onrender.com
    steps:
      - name: Check critical paths
        run: |
          set -u
          fail=0
          # Retry wrapper (Render free tier can cold-start ~20s).
          check() { # <url> [expected-content-type-substring]
            url="$1"; ct_want="${2:-}"
            for attempt in 1 2 3 4 5; do
              out=$(curl -s -o /dev/null -m 40 -w "%{http_code} %{content_type}" "$url")
              code=${out%% *}; ct=${out#* }
              if [ "$code" = "200" ] && { [ -z "$ct_want" ] || printf '%s' "$ct" | grep -q "$ct_want"; }; then
                echo "✓ $url ($out)"
                return 0
              fi
              echo "… retry $attempt: $url ($out)"
              sleep 12
            done
            echo "✗ FAILED: $url (last: $out)"
            fail=1
          }

          check "$API/api/health" "application/json"
          check "$SITE/"
          # World Cup canonical routes. The legacy paths intentionally return
          # 307/308 redirects, so probing them as if they were pages creates
          # false smoke failures even when their destinations are healthy.
          check "$SITE/football/wc26/fixtures"
          check "$SITE/football/wc26/bracket"
          check "$SITE/football/wc26/match/1"
          check "$SITE/football/wc26/team/1"
          check "$SITE/football/wc26/groups/1"
          check "$SITE/match/1/opengraph-image" "image/png"

          # Champions League: competition shell, fixture board, roster, and
          # the prediction-bearing fixture feed must all stay reachable.
          check "$SITE/football/ucl"
          check "$SITE/football/ucl/fixtures"
          check "$API/api/tournaments/ucl" "application/json"
          check "$API/api/teams?competition=ucl" "application/json"
          check "$API/api/matches/upcoming?competition=ucl" "application/json"

          check "$API/api/nrl/matches" "application/json"
          check "$API/api/nrl/projections" "application/json"
          check "$SITE/nrl"
          check "$SITE/nrl/matches"
          check "$SITE/nrl/ladder"
          check "$SITE/nrl/round/1"

          exit $fail
